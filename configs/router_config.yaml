seed: 7

data:
  num_queries: 250            # matches the reported 250 multi-intent queries
  multi_intent_fraction: 0.3
  train_fraction: 0.7

tokenizer:
  vocab_size: 2000
  max_len: 48

model:
  dim: 64
  num_layers: 2
  num_heads: 4
  ff_dim: 128
  max_len: 48

train:
  epochs: 40
  batch_size: 16
  lr: 5.0e-4

eval:
  threshold: 0.5
  judge_sample_size: 75   # cap LLM-judge calls when a real API key is set

output:
  dir: checkpoints
  results_dir: results
